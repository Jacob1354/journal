<!DOCTYPE html>
<html lang="en">
<head>
    <!--So expres.static("public") doesn't try something like /public/style.css -->
    <base href="./pages/day/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/day.css">
    <title></title>
</head>
<body>
    <nav>
        <button id="sign_out">Sign Out</button>
    </nav>
    <div id="day_container">
        <div id="day_navigation_bar">
            <button id="day_nav_left_arrow" class="day_arrow_btn">
                <svg viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <h1 id="day_nav_date">
                Day_name Day Month Year
            </h1>
            <button id="day_nav_right_arrow" class="day_arrow_btn">
                <svg viewBox="0 0 24 24">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
            </button>
        </div>
        <div id="day_content_container">
            <div id="schedule">
                <div id="scheduled_activities">
                </div>
                <div class="activity_adder">
                    <button class="add_btn" id="activity_adder_btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="0" y1="12" x2="24" y2="12"></line>
                            <line x1="12" y1="0" x2="12" y2="24"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mood_fields" id="mood_fields">
            </div>
        </div>
    </div>
    <script type="module" src="js/day.js"></script>
</body>
</html>

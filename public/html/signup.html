<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sign_in_up/style.css">
    <title>Sign Up</title>
</head>
<body>
    <nav>
        <a href="/signup">Sign up</a>
        <a href="/signin">Sign in</a>
    </nav>
    <form method="post">
        <h2>Sign Up</h2>
        <p>Name :</p>
        <input type="text" name="name" id="name">
        <p>Username :</p>
        <input type="text" name="username" id="username_input">
        <p>Password :</p>
        <input type="text" name="password" id="password_input">
        <button id="sign_up_btn" type="button">Sign Up</button>
        <p id="create_user_success"></p>
        <p id="create_user_error" class="err_text"></p>
    </form>
    <script type="module" src="../js/sign_in_up/signup.js"></script>
</body>
</html>

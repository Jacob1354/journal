<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>index</title>
</head>
<body>
    <nav>
        <a href="/signup">Sign up</a>
        <a href="/signin">Sign in</a>
    </nav>
    <form method="post">
        <h2>Sign In</h2>
        <p>Username :</p>
        <input type="text" name="username" id="username_input">
        <p>Password :</p>
        <input type="text" name="password" id="password_input">
        <button id="sign_in_btn" type="button">Sign In</button>
        <p id="signin_success"></p>
        <p id="signin_err" class="err_text"></p>
    </form>
    <script type="module" src="./signin.js"></script>
</body>
</html>
